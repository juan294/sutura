name: Sutura Verified Self-Healing CI
description: Verify failed CI, filter flaky failures, reject unsafe shortcuts, and open an evidence-backed repair PR.
author: Sutura

inputs:
  mode:
    description: inspect returns read-only evidence without provider configuration; heal generates a repair; verify executes only the supplied patch with required trusted challenges.
    required: false
    default: heal
  github-token:
    description: GitHub token for failed-run and source reads. Heal mode also publishes the comment, checks, and repair pull request; verify mode requires only repository read access. A repair pull request opened with the workflow's own token does not trigger pull_request CI normally; a GitHub App installation token does.
    required: true
  run-id:
    description: Numeric ID of the failed GitHub Actions workflow run.
    required: true
  nebius-api-key:
    description: Nebius Token Factory API key for Nemotron inference.
    required: false
  tavily-api-key:
    description: Optional Tavily API key for grounded dependency diagnosis.
    required: false
  openai-api-key:
    description: Optional OpenAI key for the GPT-6 Astra second-opinion audit. Veto-only; never widens acceptance.
    required: false
  typesafe-api-key:
    description: Optional TypeSafe API key for the existing veto-only audit and explicitly selected Jev roles. Never widens executable acceptance.
    required: false
  contree-token:
    description: Nebius ConTree token used for sandbox operations.
    required: false
  contree-project:
    description: Nebius ConTree project ID.
    required: false
  triage-n:
    description: Maximum independent failure reproductions; progressive confidence can stop earlier.
    required: false
    default: '5'
  triage-sandbox-seconds:
    description: Cumulative sandbox seconds triage may spend (1-3600). Triage reruns only the failing test file when the runner is called directly, measures its first probe and stops before a probe that would exceed this, ending gave-up with the predicted seconds; the worst case is this budget plus one probe.
    required: false
    default: '240'
  routing-profile:
    description: Price-verified model-selection profile. Incomplete profiles cannot change defaults.
    required: false
    default: production-baseline-v1
  source-sha:
    description: Exact 40-character commit whose failure is being verified. Required only by the verification route.
    required: false
  policy-base-sha:
    description: Exact 40-character commit supplying the operator-trusted repository policy. A supplied patch cannot choose it.
    required: false
  candidate-diff:
    description: Unified diff produced by another agent, verified as supplied. This route never authors a replacement or writes to the repository.
    required: false
  failing-command:
    description: Identifier of the trusted failing command to reproduce. Must resolve through the trusted command map, not arbitrary text.
    required: false
  require-fixed:
    description: Fail the action unless Sutura produces a fixed outcome. Intended for strict self-hosting and acceptance gates.
    required: false
    default: 'false'
  capture-replay:
    description: Capture credential-free external boundary data for offline repair replay.
    required: false
    default: 'false'
  runtime:
    description: Runtime selection for polyglot repositories. Auto fails closed when evidence is ambiguous.
    required: false
    default: auto
  repair-model-turns:
    description: Lower-only repair-agent model turn limit.
    required: false
    default: '8'
  repair-tool-calls:
    description: Lower-only repair-agent tool call limit.
    required: false
    default: '24'
  repair-branches:
    description: Lower-only repair-agent branch limit.
    required: false
    default: '12'
  repair-sandbox-operations:
    description: Lower-only repair-agent sandbox operation limit.
    required: false
    default: '32'
  repair-elapsed-time-sec:
    description: Lower-only repair-agent elapsed-time limit in seconds.
    required: false
    default: '600'
  repair-inference-cost-usd:
    description: Lower-only repair-agent inference-cost limit in USD.
    required: false
    default: '0.25'
  repair-second-opinion-usd:
    description: Lower-only GPT-6 Astra second-opinion cost limit in USD, separate from repair-inference-cost-usd.
    required: false
    default: '0.30'
  repair-typesafe-audit-usd:
    description: Lower-only TypeSafe Jev calibrated audit cost limit in USD, separate from repair-inference-cost-usd and repair-second-opinion-usd.
    required: false
    default: '0.02'
  jev-ranking:
    description: Explicit Jev repair frontier ranking mode, off, shadow, or assist, in heal mode only. Nonoff requires typesafe-api-key and a positive jev-budget-usd; shadow writes private runner-local inputs without inline inference.
    required: false
    default: off
  jev-grounding:
    description: Explicit Jev grounding evidence selection mode, off, shadow, or assist, in heal mode only. Nonoff requires typesafe-api-key and a positive jev-budget-usd; shadow writes private runner-local inputs without inline inference.
    required: false
    default: off
  jev-classification:
    description: Explicit Jev failure classification mode, off, shadow, or assist, in heal mode only. Nonoff requires typesafe-api-key and a positive jev-budget-usd; shadow writes private runner-local inputs without inline inference.
    required: false
    default: off
  jev-recovery:
    description: Explicit Jev recovery hypothesis selection mode, off, shadow, or assist, in heal mode only. Nonoff requires typesafe-api-key and a positive jev-budget-usd; shadow writes private runner-local inputs without inline inference.
    required: false
    default: off
  jev-budget-usd:
    description: Shared new-role Jev cap from 0 to 0.02 USD, separate from legacy audit, generation and sandbox budgets. Positive explicit authorization is required for shadow or assist; zero leaves roles off.
    required: false
    default: '0'
  repair-diff-bytes:
    description: Lower-only cumulative repair diff limit in bytes.
    required: false
    default: '65536'
  search-initial-branches:
    description: Initial adaptive checkpoint branches.
    required: false
    default: '4'
  search-beam-width:
    description: Maximum adaptive checkpoint frontier width.
    required: false
    default: '2'
  search-max-depth:
    description: Maximum adaptive checkpoint search depth.
    required: false
    default: '4'
  search-max-total-branches:
    description: Lower-only global adaptive checkpoint branch limit.
    required: false
    default: '12'
  model-nano:
    description: Optional Nemotron classifier model override.
    required: false
  model-super:
    description: Optional verified Nemotron repair model selector. Unsupported model IDs fail closed.
    required: false
  model-ultra:
    description: Optional Nemotron adversarial-audit model override.
    required: false

  verification-packet:
    description: 'Canonical one-attempt long-verification packet; only an authenticated enrolled owner dispatch can authorize it.'
    required: false
  authorize-long-verification:
    description: 'Separate SHA-256 of the canonical verification packet. Profiles and packet files alone grant no allowance.'
    required: false
outputs:
  outcome:
    description: Final Sutura outcome for the failed run, or already-attempted or repair-branch-skipped when Sutura did not start an attempt.
  semantic-shadow-path:
    description: Owner-only runner-local JSONL path when a Jev shadow role is selected. Raw comparison inputs are not uploaded automatically; preserve privately within the same job if needed.
  verification-status:
    description: Terminal supplied-patch verification status in verify mode.

  disposition:
    description: Evidence-based inspection disposition; it does not authorize repair.
  reason:
    description: Detailed inspection reason.
  owner:
    description: Domain responsible for the next action.
  evidence-digest:
    description: Digest binding the inspected run, source, metadata and bounded diagnostics.
  next-action:
    description: Concrete next operation without inferred authority.
  repair-eligible:
    description: Advisory inspection routing boolean; heal independently revalidates admission.
  inspection:
    description: Versioned read-only inspection evidence, excluding raw logs and credentials.
  publication-receipt-url:
    description: Authenticated exact-attempt publication receipt artifact, emitted only after fixed PR publication.
  terminal-evidence:
    description: Machine-readable typed terminal evidence with retained or explicitly unavailable accounting.
  terminal-artifact-url:
    description: Uploaded typed terminal artifact URL; absence does not establish successful persistence.
  terminal-reason:
    description: Validated terminal reason for a completed non-repair.
  failing-stage:
    description: Stage associated with the terminal reason.

runs:
  using: node24
  main: dist/index.cjs

branding:
  icon: activity
  color: red
