name: Case Lab
run-name: Case Lab ${{ inputs.request-id }} ${{ inputs.case-id }}

# Source of truth: packages/case-lab/demo/case-lab.yml in juan294/sutura.
# The copy in juan294/sutura-demo/.github/workflows/case-lab.yml must be byte-identical
# (proved by `case-lab verify-pin`).

on:
  workflow_dispatch:
    inputs:
      case-id:
        description: Server-defined Case Lab case
        required: true
        type: choice
        options:
          - javascript-repair
          - python-repair
          - flaky-failure
          - greenwash-trap
          - upstream-incident
      request-id:
        description: Bounded dispatcher request id
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: case-lab
  cancel-in-progress: false

env:
  # Must equal packages/case-lab/release.json actionSha and the literal in the Action step.
  SUTURA_ACTION_SHA: 3b6152d9d72beebd7dcbaaa4045c94d640456adb
  # A juan294/sutura commit that contains packages/case-lab. Updated by `case-lab verify-pin`.
  SUTURA_CONTROLLER_SHA: e605f22c9957d4ad221ef7ed85878485e98a5f71
  CASE_LAB_DAILY_RUN_CAP: '24'
  RESULTS_BRANCH: case-lab-results

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate on the emergency switch
        env:
          CASE_LAB_ENABLED: ${{ vars.CASE_LAB_ENABLED }}
        run: |
          if [ "$CASE_LAB_ENABLED" != "true" ]; then
            echo "Case Lab is disabled: set the repository variable CASE_LAB_ENABLED to true to enable live runs" >&2
            exit 1
          fi

      - name: Validate bounded dispatch input
        env:
          CASE_ID: ${{ inputs.case-id }}
          REQUEST_ID: ${{ inputs.request-id }}
        run: |
          [[ "$REQUEST_ID" =~ ^cl-[0-9]{13}-[a-f0-9]{8}$ ]] || { echo "request-id must match cl-<13 digits>-<8 hex>" >&2; exit 1; }
          case "$CASE_ID" in
            javascript-repair|python-repair|flaky-failure|greenwash-trap|upstream-incident) ;;
            *) echo "case-id must be one of the five Case Lab cases" >&2; exit 1 ;;
          esac
          [[ "$SUTURA_ACTION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SUTURA_CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Enforce the daily run cap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u +%Y-%m-%dT00:00:00Z)"
          count="$(gh run list -R "$GITHUB_REPOSITORY" --workflow case-lab.yml --created ">=$since" --limit 100 --json databaseId --jq length)"
          echo "case-lab.yml runs today (including this one): $count"
          if [ "$count" -gt "$CASE_LAB_DAILY_RUN_CAP" ]; then
            echo "Case Lab daily run cap $CASE_LAB_DAILY_RUN_CAP reached; refusing before any provider call" >&2
            exit 1
          fi

      - name: Check out the trusted demo default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check out the Case Lab tooling at the exact controller commit
        uses: actions/checkout@v7
        with:
          repository: juan294/sutura
          ref: ${{ env.SUTURA_CONTROLLER_SHA }}
          path: .sutura
          persist-credentials: false

      - name: Record exact identities
        id: identity
        run: |
          test "$(git -C .sutura rev-parse HEAD)" = "$SUTURA_CONTROLLER_SHA"
          echo "demo-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v5
        with:
          # The demo repository pins pnpm 10 for itself; the Case Lab tooling is the Sutura workspace.
          package_json_file: .sutura/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build the Case Lab tooling
        run: |
          pnpm --dir .sutura install --frozen-lockfile
          pnpm --dir .sutura --filter @sutura/core build
          pnpm --dir .sutura --filter @sutura/case-lab build

      - name: Install the released Sutura CLI for the exact release
        id: release-cli
        run: |
          version="$(node -e 'process.stdout.write(require("./.sutura/packages/case-lab/release.json").version)')"
          mkdir -p "$RUNNER_TEMP/release-cli"
          npm install --prefix "$RUNNER_TEMP/release-cli" --ignore-scripts "sutura@${version}"
          cli="$RUNNER_TEMP/release-cli/node_modules/.bin/sutura"
          chmod +x "$cli"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      - name: Expose the Placebo corpus where the matrix materializer expects it
        run: |
          # The demo's matrix materializer reads its fixtures from .sutura-action/packages/placebo/corpus,
          # while this workflow checks the Sutura tooling out at .sutura. Without this link a live
          # python-repair run fails here, before any provider call.
          mkdir -p .sutura-action/packages/placebo
          ln -s "$GITHUB_WORKSPACE/.sutura/packages/placebo/corpus" .sutura-action/packages/placebo/corpus
          # Keep the link out of the fixture commit whatever the demo's .gitignore says.
          echo '.sutura-action/' >> "$(git rev-parse --git-path info/exclude)"

      - name: Materialize the selected case
        id: materialize
        env:
          CASE_ID: ${{ inputs.case-id }}
        run: |
          node scripts/materialize-case-lab-case.mjs "$CASE_ID" > "$RUNNER_TEMP/materialized.json"
          echo "runtime=$(node -e 'process.stdout.write(require(process.env.RUNNER_TEMP + "/materialized.json").runtime)')" >> "$GITHUB_OUTPUT"

      - name: Push the broken branch and open the broken pull request
        id: fixture
        env:
          GH_TOKEN: ${{ github.token }}
          CASE_ID: ${{ inputs.case-id }}
          REQUEST_ID: ${{ inputs.request-id }}
        run: |
          branch="case-lab/${REQUEST_ID}/${CASE_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          # The Sutura checkout lives in .sutura; it must never enter the demo commit as a gitlink.
          # The corpus link in .sutura-action is ignored through .git/info/exclude (see the link step).
          # Do not name .sutura-action in a pathspec: git add exits 1 for an ignored path.
          git add -A -- . ':(exclude).sutura'
          git commit -m "case-lab(${REQUEST_ID}): materialize ${CASE_ID}"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "Case Lab ${CASE_ID} (${REQUEST_ID})" --body "Public Case Lab request \`${REQUEST_ID}\`: injected Placebo case for \`${CASE_ID}\`. Sutura reports on this pull request and never merges a repair.")"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
            echo "pr-url=$pr_url"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch CI and prove it is red
        id: failed-ci
        env:
          GH_TOKEN: ${{ github.token }}
          CASE_ID: ${{ inputs.case-id }}
          BRANCH: ${{ steps.fixture.outputs.branch }}
          RUNTIME: ${{ steps.materialize.outputs.runtime }}
        run: |
          if [ "$RUNTIME" = python ]; then
            url="$(gh workflow run matrix-fixture-ci.yml --ref "$BRANCH" -f case-id=python-repair)"
          else
            url="$(gh workflow run ci.yml --ref "$BRANCH")"
          fi
          run_id="${url##*/}"
          if gh run watch "$run_id" --exit-status; then
            echo "Expected the injected ${CASE_ID} case to fail CI" >&2
            exit 1
          fi
          test "$(gh run view "$run_id" --json conclusion --jq .conclusion)" = failure
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run-url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_OUTPUT"

      - name: Create the repository-scoped repair token
        id: repair-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUTURA_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUTURA_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: write
          permission-contents: write
          permission-pull-requests: write

      - name: Run Sutura at the exact release
        id: sutura
        continue-on-error: true
        uses: juan294/sutura/packages/action@3b6152d9d72beebd7dcbaaa4045c94d640456adb
        with:
          github-token: ${{ steps.repair-app-token.outputs.token }}
          run-id: ${{ steps.failed-ci.outputs.run-id }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          contree-token: ${{ secrets.CONTREE_TOKEN }}
          contree-project: ${{ vars.CONTREE_PROJECT }}
          capture-replay: 'true'
          runtime: ${{ steps.materialize.outputs.runtime }}

      - name: Observe native repair CI and authenticated evidence
        id: native-ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_APP_SLUG: ${{ steps.repair-app-token.outputs.app-slug }}
          CI_RUN_ID: ${{ steps.failed-ci.outputs.run-id }}
          FIXTURE_SHA: ${{ steps.fixture.outputs.sha }}
          CASE_BRANCH: ${{ steps.fixture.outputs.branch }}
          PR_URL: ${{ steps.fixture.outputs.pr-url }}
          OUTCOME: ${{ steps.sutura.outputs.outcome }}
          RUNTIME: ${{ steps.materialize.outputs.runtime }}
        run: |
          # Preserve read-only native evidence before the existing PR cleanup.
          status=0
          timeout 300s node --input-type=module <<'SUTURA_NATIVE' || status=$?
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          // BEGIN NATIVE OBSERVER
          async function observeNativeRepair(ctx) {
            const evidence = { schemaVersion: 'sutura-native-ci-v1', sourceRunId: ctx.runId,
              fixtureSha: ctx.fixtureSha, checkUrl: '', commentUrl: '', native: { status: 'unavailable' } };
            const finish = (status, reason) => {
              evidence.native = { ...evidence.native, status, ...(reason ? { reason } : {}) };
              ctx.record(evidence);
              return evidence;
            };
            const safeUrl = value => {
              try {
                const url = new URL(value);
                return url.origin === 'https://github.com' && url.pathname.startsWith('/' + ctx.repository + '/') && !/[\r\n]/u.test(value) ? url.href : '';
              } catch { return ''; }
            };
            try {
              if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/u.test(ctx.repository) ||
                  !/^[1-9][0-9]*$/u.test(ctx.runId) || !/^[a-f0-9]{40}$/u.test(ctx.fixtureSha) ||
                  !/^[A-Za-z0-9-]+$/u.test(ctx.appSlug) || !Number.isSafeInteger(ctx.fixturePrNumber) || ctx.fixturePrNumber < 1) {
                return finish('unavailable', 'invalid-source-or-app-identity');
              }
              const marker = '<!-- sutura-run:' + Buffer.from(ctx.runId).toString('base64url') + ' -->';
              const bot = ctx.appSlug + '[bot]';
              const externalId = 'sutura:' + ctx.repository + ':workflow-run:' + ctx.runId;
              const checks = (await ctx.api('repos/' + ctx.repository + '/commits/' + ctx.fixtureSha + '/check-runs?per_page=100'))
                .flatMap(page => page.check_runs).filter(check => check.external_id === externalId &&
                  check.head_sha === ctx.fixtureSha && check.app?.slug === ctx.appSlug);
              if (checks.length > 1) return finish('unavailable', 'ambiguous-source-audit');
              if (checks.length === 1) {
                evidence.checkUrl = safeUrl(checks[0].html_url);
                const comments = (await ctx.api('repos/' + ctx.repository + '/issues/' + ctx.fixturePrNumber + '/comments?per_page=100'))
                  .flat().filter(comment => comment.user?.type === 'Bot' && comment.user.login === bot &&
                    typeof comment.body === 'string' && comment.body.startsWith(marker + '\n'));
                if (comments.length > 1) return finish('unavailable', 'ambiguous-source-comment');
                evidence.commentUrl = comments.length === 1 ? safeUrl(comments[0].html_url) : '';
              }
              if (ctx.outcome !== 'fixed') return finish('not-applicable', 'no-fixed-repair');
              if (checks.length !== 1) return finish('unavailable', 'source-audit-unavailable');
              const branch = 'sutura/fix-' + ctx.runId;
              const owner = ctx.repository.split('/')[0];
              const pulls = (await ctx.api('repos/' + ctx.repository + '/pulls?state=all&head=' + encodeURIComponent(owner + ':' + branch) + '&per_page=100'))
                .flat().filter(pr => pr.head?.ref === branch && pr.head?.repo?.full_name === ctx.repository &&
                  pr.base?.ref === ctx.caseBranch && /^[a-f0-9]{40}$/u.test(pr.head?.sha ?? '') &&
                  pr.user?.type === 'Bot' && pr.user.login === bot && typeof pr.body === 'string' && pr.body.startsWith(marker + '\n'));
              if (pulls.length !== 1) return finish('unavailable', 'repair-pr-missing-or-ambiguous');
              const pr = pulls[0];
              const commit = (await ctx.api('repos/' + ctx.repository + '/commits/' + pr.head.sha))[0];
              if (!commit?.parents?.some(parent => parent.sha === ctx.fixtureSha)) return finish('unavailable', 'repair-head-source-parent-mismatch');
              evidence.repairPrUrl = safeUrl(pr.html_url);
              evidence.repairHeadSha = pr.head.sha;
              // The Python fixture workflow is dispatch-only; generic JS CI cannot verify it.
              if (ctx.runtime !== 'node') return finish('unavailable', 'python-fixture-has-no-pr-ci-contract');
              const deadline = ctx.now() + 290000;
              while (ctx.now() < deadline) {
                const runs = (await ctx.api('repos/' + ctx.repository + '/actions/workflows/ci.yml/runs?event=pull_request&head_sha=' + pr.head.sha + '&per_page=100'))
                  .flatMap(page => page.workflow_runs).filter(run => run.head_sha === pr.head.sha && run.head_branch === branch &&
                    run.path === '.github/workflows/ci.yml' && run.event === 'pull_request');
                if (runs.length > 1) return finish('unavailable', 'ambiguous-native-runs');
                if (runs.length === 1) {
                  const run = runs[0];
                  if (!Array.isArray(run.pull_requests) || !run.pull_requests.some(association =>
                      association.number === pr.number && association.head?.sha === pr.head.sha &&
                      association.head?.ref === branch && association.base?.ref === ctx.caseBranch &&
                      association.base?.sha === ctx.fixtureSha)) {
                    return finish('unavailable', 'native-run-repair-pr-association-mismatch');
                  }
                  if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) return finish('unavailable', 'native-run-attempt-unavailable');
                  evidence.native = { status: 'pending', runId: run.id, runAttempt: run.run_attempt, headSha: run.head_sha,
                    workflow: run.path, event: run.event, url: safeUrl(run.html_url), conclusion: run.conclusion };
                  ctx.record(evidence);
                  if (run.status === 'action_required' || run.conclusion === 'action_required') return finish('approval_required');
                  if (run.status === 'completed') {
                    const jobs = (await ctx.api('repos/' + ctx.repository + '/actions/runs/' + run.id + '/attempts/' + run.run_attempt + '/jobs?per_page=100'))
                      .flatMap(page => page.jobs);
                    evidence.native.jobs = jobs.map(job => ({ id: job.id, name: job.name, status: job.status, conclusion: job.conclusion }));
                    if (run.conclusion !== 'success') return finish(run.conclusion === 'failure' ? 'failure' : 'unavailable', 'native-run-not-successful');
                    if (!jobs.some(job => job.name === 'test') || jobs.some(job => job.status !== 'completed' || job.conclusion !== 'success')) {
                      return finish('unavailable', 'native-job-proof-incomplete');
                    }
                    return finish('success');
                  }
                }
                await ctx.pause(5000);
              }
              return finish('timeout', 'native-ci-not-completed-before-deadline');
            } catch { return finish('unavailable', 'github-evidence-read-failed'); }
          }
          // END NATIVE OBSERVER
          const env = process.env;
          const path = env.RUNNER_TEMP + '/native-ci.json';
          const evidence = await observeNativeRepair({
            repository: env.GITHUB_REPOSITORY, runId: env.CI_RUN_ID, fixtureSha: env.FIXTURE_SHA,
            fixturePrNumber: Number(env.PR_URL?.split('/').at(-1)), caseBranch: env.CASE_BRANCH,
            appSlug: env.REPAIR_APP_SLUG, outcome: env.OUTCOME, runtime: env.RUNTIME,
            api: async path => JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', path], { encoding: 'utf8', timeout: 15000, maxBuffer: 8 * 1024 * 1024 })),
            now: Date.now, pause: setTimeout,
            record: value => writeFileSync(path, JSON.stringify(value, null, 2) + '\n', { mode: 0o600 }),
          });
          appendFileSync(env.GITHUB_OUTPUT, 'check-url=' + evidence.checkUrl + '\ncomment-url=' + evidence.commentUrl + '\nnative-status=' + evidence.native.status + '\n');
          appendFileSync(env.GITHUB_STEP_SUMMARY, 'Native repair CI: **' + evidence.native.status + '**. A fixed outcome is sandbox proof; native CI is a separate gate.\n\n' + (evidence.native.url ?? '') + '\n');
          if (evidence.native.status !== 'success' && evidence.native.status !== 'not-applicable') console.log('::warning::Native repair CI is ' + evidence.native.status + '; end-to-end verification remains unmet.');
          SUTURA_NATIVE
          if [ "$status" -ne 0 ]; then
            NATIVE_EXIT="$status" node --input-type=module <<'SUTURA_NATIVE_STOP'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/native-ci.json';
          let evidence = {};
          try { evidence = JSON.parse(readFileSync(path, 'utf8')); } catch {}
          evidence.schemaVersion = 'sutura-native-ci-v1';
          evidence.sourceRunId = process.env.CI_RUN_ID;
          evidence.fixtureSha = process.env.FIXTURE_SHA;
          evidence.native = { ...evidence.native, status: process.env.NATIVE_EXIT === '124' ? 'timeout' : 'unavailable', reason: 'bounded-native-observer-stopped' };
          writeFileSync(path, JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Native repair CI: **' + evidence.native.status + '**. Bounded observation stopped; end-to-end verification remains unmet.\n');
          console.log('::warning::Native repair CI observation stopped without verified success.');
          SUTURA_NATIVE_STOP
          fi

      - name: Preserve the native CI evidence
        uses: actions/upload-artifact@v7
        with:
          name: sutura-native-ci-${{ steps.failed-ci.outputs.run-id }}
          path: ${{ runner.temp }}/native-ci.json
          if-no-files-found: error
          retention-days: 90

      - name: Collect the public evidence links and the replay bundle
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.failed-ci.outputs.run-id }}
          FIXTURE_SHA: ${{ steps.fixture.outputs.sha }}
          PR_URL: ${{ steps.fixture.outputs.pr-url }}
          AUTHENTICATED_CHECK_URL: ${{ steps.native-ci.outputs.check-url }}
          AUTHENTICATED_COMMENT_URL: ${{ steps.native-ci.outputs.comment-url }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay"
          for _ in $(seq 1 12); do
            if gh run download "$GITHUB_RUN_ID" --name "sutura-replay-${CI_RUN_ID}.json" --dir "$RUNNER_TEMP/replay"; then break; fi
            sleep 5
          done
          replay="$(find "$RUNNER_TEMP/replay" -type f -name '*.json' -print -quit || true)"
          repair_pr="$(gh pr list --head "sutura/fix-${CI_RUN_ID}" --state all --json url --jq '.[0].url // ""')"
          repair_paths=""
          if [ -n "$repair_pr" ]; then repair_paths="$(gh pr diff "$repair_pr" --name-only)"; fi
          check_url="$AUTHENTICATED_CHECK_URL"
          comment_url="$AUTHENTICATED_COMMENT_URL"
          case_artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"sutura-case-file-${CI_RUN_ID}.html\") | .id" | head -n 1)"
          replay_artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"sutura-replay-${CI_RUN_ID}.json\") | .id" | head -n 1)"
          {
            echo "replay=$replay"
            echo "repair-pr=$repair_pr"
            echo "repair-paths<<CASE_LAB_EOF"
            echo "$repair_paths"
            echo "CASE_LAB_EOF"
            echo "check-url=$check_url"
            echo "comment-url=$comment_url"
            echo "case-artifact-url=${case_artifact_id:+https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${case_artifact_id}}"
            echo "replay-artifact-url=${replay_artifact_id:+https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${replay_artifact_id}}"
          } >> "$GITHUB_OUTPUT"

      - name: Reproduce the case file from the replay bundle with the released CLI
        id: case-file
        if: ${{ steps.collect.outputs.replay != '' }}
        continue-on-error: true
        env:
          REPLAY: ${{ steps.collect.outputs.replay }}
          RUNTIME: ${{ steps.materialize.outputs.runtime }}
        run: |
          "${{ steps.release-cli.outputs.cli }}" replay --bundle "$REPLAY" --format json --runtime "$RUNTIME" > "$RUNNER_TEMP/case-file.json"
          echo "path=$RUNNER_TEMP/case-file.json" >> "$GITHUB_OUTPUT"

      - name: Publish the public-safe result document
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CONTREE_TOKEN: ${{ secrets.CONTREE_TOKEN }}
          REQUEST_ID: ${{ inputs.request-id }}
          CASE_ID: ${{ inputs.case-id }}
          OUTCOME: ${{ steps.sutura.outputs.outcome }}
          DEMO_SHA: ${{ steps.identity.outputs.demo-sha }}
          CASE_FILE: ${{ steps.case-file.outputs.path }}
          REPLAY: ${{ steps.collect.outputs.replay }}
          CI_RUN_URL: ${{ steps.failed-ci.outputs.run-url }}
          PR_URL: ${{ steps.fixture.outputs.pr-url }}
          REPAIR_PR_URL: ${{ steps.collect.outputs.repair-pr }}
          REPAIR_PATHS: ${{ steps.collect.outputs.repair-paths }}
          CHECK_URL: ${{ steps.collect.outputs.check-url }}
          COMMENT_URL: ${{ steps.collect.outputs.comment-url }}
          CASE_ARTIFACT_URL: ${{ steps.collect.outputs.case-artifact-url }}
          REPLAY_ARTIFACT_URL: ${{ steps.collect.outputs.replay-artifact-url }}
        run: |
          node .sutura/packages/case-lab/bin/case-lab.js publish-result \
            --request-id "$REQUEST_ID" --case "$CASE_ID" --outcome "$OUTCOME" \
            --demo-sha "$DEMO_SHA" --controller-sha "$SUTURA_CONTROLLER_SHA" \
            --workflow-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --ci-run-url "$CI_RUN_URL" --pull-request-url "$PR_URL" \
            --repair-pull-request-url "$REPAIR_PR_URL" --check-url "$CHECK_URL" --refusal-comment-url "$COMMENT_URL" \
            --case-file-artifact-url "$CASE_ARTIFACT_URL" --replay-artifact-url "$REPLAY_ARTIFACT_URL" \
            --case-file "$CASE_FILE" --replay "$REPLAY" --repair-paths "$REPAIR_PATHS" \
            --out "$RUNNER_TEMP/result.json"

      - name: Commit the result to the public results branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request-id }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/results"
          cd "$RUNNER_TEMP/results"
          if git ls-remote --exit-code origin "refs/heads/${RESULTS_BRANCH}" >/dev/null; then
            git fetch origin "${RESULTS_BRANCH}"
            git checkout -B "${RESULTS_BRANCH}" "origin/${RESULTS_BRANCH}"
          else
            git checkout --orphan "${RESULTS_BRANCH}"
            git rm -rf --quiet . || true
            printf '# Case Lab results\n\nPublic-safe result documents written by the Case Lab workflow. Never edited by hand.\n' > README.md
          fi
          mkdir -p results
          test ! -e "results/${REQUEST_ID}.json"
          cp "$RUNNER_TEMP/result.json" "results/${REQUEST_ID}.json"
          git add -A -- . ':(exclude).sutura'
          git commit -m "case-lab: publish ${REQUEST_ID}"
          git push origin "HEAD:${RESULTS_BRANCH}"

      - name: Upload the result artifact
        uses: actions/upload-artifact@v7
        with:
          name: sutura-case-lab-${{ inputs.request-id }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: error
          retention-days: 90

      - name: Require native CI for a fixed repair
        env:
          OUTCOME: ${{ steps.sutura.outputs.outcome }}
          NATIVE_STATUS: ${{ steps.native-ci.outputs.native-status }}
        run: |
          if [ "$OUTCOME" = "fixed" ] && [ "$NATIVE_STATUS" != "success" ]; then
            echo "::error::Sandbox repair is fixed but native CI is ${NATIVE_STATUS:-unavailable}; end-to-end verification is unmet."
            exit 1
          fi

      - name: Close the reported pull requests and discard their held CI runs
        if: ${{ always() && steps.fixture.outputs.branch != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CASE_BRANCH: ${{ steps.fixture.outputs.branch }}
          CI_RUN_ID: ${{ steps.failed-ci.outputs.run-id }}
        run: |
          # Pull requests opened with the workflow token get their pull_request CI run held
          # for approval, and GitHub fails a held run after 30 days with an email to the owner.
          # The result document already links both pull requests; closed ones stay readable.
          # The repair pull request targets the case branch, so close it first.
          branches=()
          if [ -n "$CI_RUN_ID" ]; then branches+=("sutura/fix-${CI_RUN_ID}"); fi
          branches+=("$CASE_BRANCH")
          for branch in "${branches[@]}"; do
            for pr in $(gh pr list --head "$branch" --state open --json number --jq '.[].number'); do
              gh pr close "$pr" --comment "Case Lab recorded this request, so this bot pull request is closed. Its commits and checks stay reachable here."
            done
            if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
            for run in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&status=action_required&per_page=100" --jq '.workflow_runs[].id'); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}"
            done
          done
