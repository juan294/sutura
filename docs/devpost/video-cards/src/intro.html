<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Intro card</title>
<link rel="stylesheet" href="base.css">
<style>
  body { background: radial-gradient(ellipse at 20% 10%, #1e2329 0%, var(--bg) 55%); }
  .wrap { position: absolute; left: 160px; top: 150px; right: 160px; }
  .brand { display: flex; align-items: center; gap: 48px; }
  .brand svg { width: 190px; height: 190px; border-radius: 34px; outline: 3px solid var(--line); }
  .brand h1 { font-size: 190px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
  .tagline { font-size: 86px; font-weight: 700; color: var(--accent); margin-top: 52px; letter-spacing: -.01em; }
  .claim { font-size: 50px; color: var(--ink); margin-top: 34px; line-height: 1.3; max-width: 1500px; }
  .claim b { color: var(--ok); font-weight: 700; }
  .by { position: absolute; left: 160px; bottom: 110px; font-size: 46px; color: var(--muted); }
  .by b { color: var(--ink); font-weight: 700; }
  .event { position: absolute; right: 160px; bottom: 110px; text-align: right; font-size: 36px; color: var(--muted); line-height: 1.5; }
  .event b { color: var(--ink); font-weight: 600; }
  .badge { position: absolute; right: 160px; top: 170px; display: flex; align-items: center; gap: 22px; background: var(--sheet); border: 2px solid var(--line); border-radius: 999px; padding: 22px 40px; font-size: 36px; color: var(--muted); }
  .badge .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 10px rgba(76,195,138,.18); }
</style></head>
<body>
  <div class="badge"><span class="dot"></span>Live demo</div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-label="Sutura"><rect width="64" height="64" fill="#1b1f24"/><path d="M14 40 L50 24" stroke="#ff6b61" stroke-width="3" stroke-linecap="round"/><g stroke="#fbfbf9" stroke-width="4" stroke-linecap="round"><path d="M20 26 L26 44"/><path d="M29 24 L35 42"/><path d="M38 22 L44 40"/></g></svg>
      <h1>Sutura</h1>
    </div>
    <div class="tagline">Verified self-healing CI</div>
    <div class="claim">AI agents make CI green.<br>Sutura <b>proves the fix is real</b>, and a human decides.</div>
  </div>
  <div class="by">by <b>Juan González</b></div>
  <div class="event"><b>Nebius × NVIDIA Global AI Hackathon</b><br>Built on Nebius Token Factory and ConTree with NVIDIA Nemotron</div>
</body></html>
