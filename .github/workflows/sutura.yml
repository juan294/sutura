name: Sutura

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: sutura-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Sutura action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Repair failed CI
        uses: ./packages/action
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          contree-token: ${{ secrets.CONTREE_TOKEN }}
          contree-project: ${{ vars.CONTREE_PROJECT }}
