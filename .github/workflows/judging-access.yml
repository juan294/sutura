name: Judging access

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check finite access window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%FT%TZ)" > "2026-12-23T20:00:00Z" ]]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'Judging access window has ended; no URLs checked.'
          else
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.window.outputs.active == 'true'
        with:
          node-version: '24'
      - name: Collect anonymous access evidence
        if: steps.window.outputs.active == 'true'
        run: node scripts/judging-access-collect.mjs docs/demo/judging-access-manifest.json judging-access-report
      - uses: actions/upload-artifact@v7
        if: always() && steps.window.outputs.active == 'true'
        with:
          name: judging-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: judging-access-report/
          retention-days: 90
          if-no-files-found: error
